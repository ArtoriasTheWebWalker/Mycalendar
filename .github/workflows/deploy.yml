name: Deploy to GitHub Pages

# Builds config.js from repo Variables at deploy time (config.js stays
# gitignored — never committed), then publishes the static site to Pages.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Write config.js from repo Variables
        run: |
          cat > config.js <<EOF
          window.CONFIG = {
            SUPABASE_URL: "${{ vars.SUPABASE_URL }}",
            SUPABASE_ANON_KEY: "${{ vars.SUPABASE_ANON_KEY }}",
          };
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
