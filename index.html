<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>My Calendar</title>
  <meta name="theme-color" content="#131419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="My Calendar" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Sign-in overlay (Supabase mode, signed out). Two steps: email → 6-digit code. -->
  <div id="auth" class="auth">
    <div class="auth-card">
      <div class="auth-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4.5" width="18" height="17" rx="3"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/>
        </svg>
      </div>
      <h1>My Calendar</h1>

      <form id="auth-form" class="auth-step">
        <p class="auth-lead">Enter your email and we’ll send a 6-digit sign-in code.</p>
        <input id="auth-email" type="email" inputmode="email" placeholder="you@example.com" autocomplete="email" required />
        <button type="submit" class="primary-btn auth-btn" id="auth-send">Send code</button>
      </form>

      <form id="code-form" class="auth-step hidden">
        <p class="auth-lead">Enter the 6-digit code sent to <span id="code-email" class="code-email"></span>.</p>
        <input id="auth-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" />
        <button type="submit" class="primary-btn auth-btn" id="auth-verify">Verify &amp; sign in</button>
        <button type="button" class="link-btn" id="code-back">Use a different email</button>
      </form>

      <p id="auth-msg" class="auth-msg"></p>
    </div>
  </div>

  <div id="app" class="app">
    <aside class="rail">
      <div class="rail-year">
        <button class="icon-btn" id="year-prev" aria-label="Previous year">‹</button>
        <span id="rail-year-label">2026</span>
        <button class="icon-btn" id="year-next" aria-label="Next year">›</button>
      </div>
      <nav class="rail-months" id="rail-months"></nav>
      <div class="rail-foot">
        <button class="ghost-btn" id="theme-toggle" title="Toggle theme">◐ Theme</button>
        <button class="ghost-btn hidden" id="signout-btn">Sign out</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-title">
          <h2 id="month-title">Month</h2>
          <span id="mode-badge" class="badge" title="Storage mode"></span>
        </div>
        <div class="topbar-actions">
          <button class="ghost-btn" id="today-btn">Today</button>
          <button class="icon-btn" id="month-prev" aria-label="Previous month">‹</button>
          <button class="icon-btn" id="month-next" aria-label="Next month">›</button>
        </div>
      </header>

      <div class="weekdays" id="weekdays"></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>

  <!-- Day sheet (mobile): a readable list of one day's events. -->
  <div id="daysheet" class="sheet">
    <div class="sheet-card">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h3 id="sheet-date">Day</h3>
        <button class="icon-btn" id="sheet-close" aria-label="Close">✕</button>
      </div>
      <div id="sheet-events" class="sheet-events"></div>
      <button class="primary-btn sheet-add" id="sheet-add">+ Add event</button>
    </div>
  </div>

  <!-- Event editor -->
  <div id="modal" class="modal">
    <div class="modal-card">
      <div class="modal-head">
        <h3 id="modal-title">New event</h3>
        <button class="icon-btn" id="modal-close" aria-label="Close">✕</button>
      </div>
      <form id="event-form">
        <input type="hidden" id="event-id" />
        <label>Date<input id="event-date" type="date" required /></label>
        <label>Title<input id="event-title" type="text" placeholder="e.g. SE401 final, 9am" autocomplete="off" required /></label>
        <label>Category <span class="muted">(optional)</span><input id="event-category" type="text" placeholder="e.g. Uni, Personal" autocomplete="off" /></label>
        <div class="field">
          <span class="field-label">Color</span>
          <div class="swatches" id="event-colors"></div>
        </div>
        <label>Notes <span class="muted">(optional)</span><textarea id="event-notes" rows="3" autocomplete="off"></textarea></label>
        <label class="check-row"><input id="event-done" type="checkbox" /> Mark as done</label>
        <div class="modal-actions">
          <button type="button" class="danger-btn hidden" id="event-delete">Delete</button>
          <div class="spacer"></div>
          <button type="submit" class="primary-btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js" onerror="window.__NO_CONFIG__=true"></script>
  <script src="store.js"></script>
  <script src="calendar.js"></script>
</body>
</html>
